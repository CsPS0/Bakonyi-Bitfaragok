<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style2.css">
    <title>Bakonyi Bitfaragók</title>
</head>
<body>
    <header>
        <h1>Második Feladat</h1>
    </header>
    <nav>
        <ul>
            <li><a href="../fel1/index1.html">Második Feladat</a></li>
        </ul>
    </nav>
    <main>
        <div> <!-- https://www.w3schools.com/html/html_forms.asp -->
            <form id="tankolasForm">
                <input type="date" id="datum" required>
                <input type="number" id="mennyiseg" placeholder="Tankolt mennyiség" required>
                <input type="number" id="koltseg" placeholder="Fizetett összeg" required>
                <input type="number" id="km" placeholder="Kilométer óra állása" required>
                <button type="submit">Tankolás rögzítése</button>
            </form>
        </div>
        <div>
            <h2>Havi költségek</h2>
            <form id="dateFilterForm">
                <input type="date" id="startDate" required>
                <input type="date" id="endDate" required>
                <button type="submit">Szűrés</button>
            </form>
            <h2>Tankolási Napló</h2>
        </div>
    </main>
    <footer>

    </footer>
    <script src="script2.js"></script>
</body>
</html>
