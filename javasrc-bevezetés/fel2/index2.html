<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style2.css">
    <title>Bakonyi Bitfaragók</title>
</head>
<body>
    <main>
        <section>
            <h1>Tankolási Napló</h1>
            <form id="tankolasForm">
                <label for="datum">Dátum:</label>
                <input type="date" id="datum" name="datum" required><br>
                <label for="mennyiseg">Mennyiség (liter):</label>
                <input type="number" id="mennyiseg" name="mennyiseg" step="0.01" required><br>
                <label for="koltseg">Költség (Ft):</label>
                <input type="number" id="koltseg" name="koltseg" step="0.01" required><br>
                <label for="km">Kilométer állás:</label>
                <input type="number" id="km" name="km" required><br>
                <button type="submit">Hozzáadás</button>
            </form>
        </section>
        <section class="naplo-container">
            <h2>Havi költségek</h2>
            <h2>Hatékonyság szerinti rangsor</h2>
        </section>
        <section>
            <h2>Szűrés dátum szerint</h2>
            <form id="dateFilterForm">
                <label for="startDate">Kezdő dátum:</label>
                <input type="date" id="startDate" name="startDate" required><br>
                <label for="endDate">Vég dátum:</label>
                <input type="date" id="endDate" name="endDate" required><br>
                <button type="submit">Szűrés</button>
            </form>
        </section>
        <section id="tankolasi-naplo"></section>
    </main>
    <footer>
        <p>© 2024 Bakonyi Bitfaragók</p>
    </footer>
    <script src="script2.js"></script>
</body>
</html>
