<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akkumulátor Játék</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="segedsegModal" class="modal">
        <div class="modal-tartalom">
            <span id="modalBezaras" class="modal-bezar">&times;</span>
            <h2 id="modalCim">Segítség, <span id="jatekosNevModal"></span>!</h2>
            <p id="modalUzenet">A vihar elvitte az áramot, segítened kell az embereknek!</p>
            <button id="modalRendben">Rendben, segítek!</button>
        </div>
    </div>    
    <header>
        <h1>Akkumulátor Játék</h1>
        <button id="sotetGomb" class="sotet-kapcsolo">
            <img src="../forras/images/sun.svg" alt="Nap ikon" class="nap-ikon" width="50" height="50">
            <img src="../forras/images/moon.svg" alt="Hold ikon" class="hold-ikon" height="800" width="800">
        </button>
    </header>
    <main>
        <div id="feladvanykivalaszto">
            <select id="feladvanylista">
                <option value="1">Nagyon Könnyű</option>
                <option value="2">Könnyű</option>
                <option value="3">Közepes</option>
                <option value="4">Nehéz</option>
                <option value="5">Ultra Nehéz</option>
            </select>
            <button id="feladvanybetoltes">Újrapróbálás</button>
        </div>
        <canvas id="jatekVaszon" width="800" height="600"></canvas>
        <div id="muhelyek"></div>
        <button id="megoldasEllenorzese">Megoldás ellenőrzése</button>
        <br>
        <div id="allapot"></div>
        <script src="script.js"></script>
    </main>
</body>
</html>
