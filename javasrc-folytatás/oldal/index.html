<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Gyümölcsszedős játék</title>
</head>
<body>
    <h1>Gyümölcsszedős játék</h1>
    <div id="game-info">
        <p>Lépések: <span id="steps-left">10</span></p>
        <p>Gyümölcsök: <span id="fruit-collected">0</span></p>
        <p>Legjobb eredmény: <span id="best-score">0</span></p>
    </div>
    <div id="game-board"></div>
    <button id="new-game-btn">Új játék</button>
    <div id="abilities">
        <button id="diagonal-move">Átlós mozgás</button>
        <button id="teleport">Teleport</button>
        <button id="harvest-neighbors">Szomszédos mezők szüretelése</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
